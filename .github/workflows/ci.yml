name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_paid_testnet_e2e:
        description: "Spend exactly $0.50 testnet USDC on the locked Base Sepolia rehearsal"
        required: true
        default: false
        type: boolean

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="--all" .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Live paid e2e against the deployed testnet worker. Manual because it
  # spends faucet USDC and real model tokens (docs/TESTING.md).
  testnet-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_paid_testnet_e2e == true
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/e2e.mjs
        env:
          VERISTAT_URL: ${{ vars.TESTNET_VERISTAT_URL }}
          ENABLE_PAID_CALL: "1"
          NETWORK: eip155:84532
          BUYER_PRIVATE_KEY: ${{ secrets.TESTNET_BUYER_PRIVATE_KEY }}
