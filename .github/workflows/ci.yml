name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Live paid e2e against the deployed testnet worker. Manual because it
  # spends faucet USDC and real model tokens (docs/TESTING.md).
  testnet-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/e2e.mjs
        env:
          VERISTAT_URL: ${{ vars.TESTNET_VERISTAT_URL }}
          BUYER_PRIVATE_KEY: ${{ secrets.TESTNET_BUYER_PRIVATE_KEY }}
